name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python infrastructure/scripts/check_no_secrets.py
      # PYSEC-2020-25: autobahn 19.11.2, pinned exactly by kiteconnect for
      # its WebSocket ticker (KiteTicker). AEGIS never uses KiteTicker --
      # only KiteConnect's REST calls (generate_session/profile/historical
      # bars/quotes) -- so this vulnerable code path is never reachable.
      # Revisit before any live-trading phase that would use real-time
      # order-status streaming, since that would exercise this dependency.
      - run: pip-audit --ignore-vuln PYSEC-2020-25
      - run: make test
      - run: ruff check apps packages tests
      - run: ruff format --check apps packages tests
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cockpit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
