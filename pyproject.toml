[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-sprint0"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2",
  "sqlalchemy>=2",
  "psycopg[binary]>=3",
  "redis>=5",
  "boto3>=1.34",
  "polars>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "apps/api",
  "packages/shared",
  "packages/domain",
  "packages/configuration",
  "packages/audit",
  "packages/data_quality",
  "packages/provider_adapters",
  "packages/data_ingestion",
  "packages/instrument_master",
  "packages/corporate_actions",
  "packages/research_registry",
  "packages/backtesting",
  "packages/feature_engine",
  "packages/risk",
  "packages/strategies",
  "packages/portfolio",
  "packages/paper_trading",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
