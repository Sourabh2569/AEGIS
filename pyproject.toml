[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-sprint0"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2",
  "sqlalchemy>=2",
  "psycopg[binary]>=3",
  "redis>=5",
  "boto3>=1.34",
  "polars>=0.20",
  "kiteconnect>=5.0",
  "PyJWT>=2.8",
  "bcrypt>=4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "httpx>=0.27"]

[tool.setuptools]
# This project ships no installable top-level package of its own -- every
# subpackage under apps/ and packages/ is imported via the explicit
# pythonpath list below (and the matching PYTHONPATH in Makefile/Dockerfile),
# never via a normal package install. Without this, setuptools' automatic
# package discovery finds apps/, packages/, sample_data/, infrastructure/ as
# ambiguous top-level packages and refuses to build (this broke
# `pip install -e .` -- and therefore the entire CI job -- on every run).
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "apps/api",
  "packages/shared",
  "packages/domain",
  "packages/configuration",
  "packages/audit",
  "packages/data_quality",
  "packages/data_activation",
  "packages/provider_adapters",
  "packages/auth",
  "packages/data_ingestion",
  "packages/instrument_master",
  "packages/corporate_actions",
  "packages/research_registry",
  "packages/research_activation",
  "packages/backtesting",
  "packages/feature_engine",
  "packages/risk",
  "packages/strategies",
  "packages/portfolio",
  "packages/paper_trading",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI's Depends(...)-as-default-argument is the framework's own
# documented pattern (apps/api/aegis_api/main.py uses it ~50 times), not a
# bug -- FastAPI's own docs recommend ignoring this rule.
ignore = ["F401", "F403", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
